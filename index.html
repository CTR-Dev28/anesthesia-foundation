<style>
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-style:normal;font-display:swap;src:url(ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:500;font-style:normal;font-display:swap;src:url(ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:600;font-style:normal;font-display:swap;src:url(ibm-plex-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-style:normal;font-display:swap;src:url(ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-style:normal;font-display:swap;src:url(ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-style:normal;font-display:swap;src:url(ibm-plex-mono-latin-600-normal.woff2) format('woff2')}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}
:root {
  --bg: #f2f6f6;
  --surface: #ffffff;
  --surface2: #e8eff0;
  --line: #d0dcdd;
  --fg: #12262a;
  --muted: #4b6165;
  --accent: #0a6b65;
  --accent-fg: #ffffff;
  --accent-soft: #d7eeeb;
  --warn-bg: #fff3d1;
  --warn-fg: #6a4200;
  --warn-line: #e2bd58;
  --danger: #b3261e;
  --danger-bg: #fde9e7;
  --danger-line: #efb1ac;
  --ok: #1a6a38;
  --ok-bg: #dcf2e3;
  --st-label: #0a6b65;
  --st-guide: #1f55a8;
  --st-lit: #6a3d9e;
  --st-pend: #8a5700;
  --st-book: #1a6a38;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1416;
    --surface: #131f22;
    --surface2: #1b2b2f;
    --line: #2a3d41;
    --fg: #e3eeee;
    --muted: #94aaad;
    --accent: #4fd0c0;
    --accent-fg: #06201d;
    --accent-soft: #15332f;
    --warn-bg: #2d2410;
    --warn-fg: #f2c96b;
    --warn-line: #6d5518;
    --danger: #ff8d84;
    --danger-bg: #331614;
    --danger-line: #7a2e29;
    --ok: #74d996;
    --ok-bg: #12301d;
    --st-label: #4fd0c0;
    --st-guide: #86b1f5;
    --st-lit: #c4a1f2;
    --st-pend: #f2c96b;
    --st-book: #74d996;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1416;
  --surface: #131f22;
  --surface2: #1b2b2f;
  --line: #2a3d41;
  --fg: #e3eeee;
  --muted: #94aaad;
  --accent: #4fd0c0;
  --accent-fg: #06201d;
  --accent-soft: #15332f;
  --warn-bg: #2d2410;
  --warn-fg: #f2c96b;
  --warn-line: #6d5518;
  --danger: #ff8d84;
  --danger-bg: #331614;
  --danger-line: #7a2e29;
  --ok: #74d996;
  --ok-bg: #12301d;
  --st-label: #4fd0c0;
  --st-guide: #86b1f5;
  --st-lit: #c4a1f2;
  --st-pend: #f2c96b;
  --st-book: #74d996;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--font);
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
}
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 15px; font-weight: 600; }
h4 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
a { color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.row > * { min-width: 0; }
.grow { flex: 1 1 140px; }
.sp { margin-top: 12px; }

/* header, banner, patient */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.banner { display: flex; gap: 10px; align-items: flex-start; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
.banner.info { background: var(--surface2); color: var(--fg); border: 1px solid var(--line); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card.em { border-left: 5px solid var(--danger); border-color: var(--danger-line); border-left-color: var(--danger); }
.patient { margin-bottom: 10px; }
.patient-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lbl { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
input[type=text], input[type=number], input[type=search], select {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  font: 500 16px var(--mono);
}
select { font-family: var(--font); font-weight: 500; }
input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.age-pair { display: grid; grid-template-columns: 1fr 78px; gap: 6px; }
.chk { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip, .gchip {
  min-height: 36px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface2); color: var(--fg);
  font: 500 13px var(--font);
}
.pchip:hover, .gchip:hover { border-color: var(--accent); }
.gchip[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn {
  min-height: 40px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
  font: 600 14px var(--font);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { min-height: 32px; padding: 3px 10px; font-size: 13px; }
.alerts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.alert { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

/* sticky strip */
.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.sum { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 2px 4px; font-size: 14px; }
.sum .pt { font: 600 14px var(--mono); }
.tag { font: 600 11px var(--font); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; }
.tag.ex { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
.tag.band { background: var(--accent-soft); color: var(--accent); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; padding-top: 2px; }
.tab {
  flex: 0 0 auto; min-height: 42px; padding: 8px 12px; cursor: pointer;
  border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
  background: none; color: var(--muted); font: 500 14px var(--font); white-space: nowrap;
}
.tab:hover { color: var(--fg); }
.tab[aria-selected=true] { background: var(--surface); color: var(--fg); border-color: var(--line); box-shadow: inset 0 -3px 0 var(--accent); }
.tab.em { color: var(--danger); }
.tab.em[aria-selected=true] { box-shadow: inset 0 -3px 0 var(--danger); }

/* chips */
.chip {
  display: inline-flex; align-items: center; font: 600 11px var(--font); letter-spacing: .05em;
  text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap;
}
.st-label { color: var(--st-label); }
.st-guideline { color: var(--st-guide); }
.st-literature { color: var(--st-lit); }
.st-pending { color: var(--st-pend); }
.st-book { color: var(--st-book); }
a.src {
  display: inline-block; font: 500 12px var(--mono); color: var(--accent); text-decoration: none;
  padding: 2px 6px; border-radius: 5px; background: var(--accent-soft); margin: 0 2px;
}
a.src:hover { text-decoration: underline; }
.src.bad { color: var(--danger); background: var(--danger-bg); }
.kind { font: 500 12px var(--font); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* controls row on drugs tab */
.toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.view-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 10px; }

/* drug cards */
details.drug { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
details.drug > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
details.drug > summary::-webkit-details-marker { display: none; }
details.drug > summary::before { content: '+'; font: 600 16px var(--mono); color: var(--accent); grid-column: 1; grid-row: 1; }
details.drug[open] > summary::before { content: '–'; }
.d-name { font-weight: 600; font-size: 16px; grid-column: 2; grid-row: 1; }
.d-class { color: var(--muted); font-size: 13px; grid-column: 2; grid-row: 2; }
.d-count { grid-column: 3; grid-row: 1; font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; }
details.more { margin-top: 8px; }
details.more > summary { cursor: pointer; color: var(--accent); font-weight: 500; font-size: 14px; min-height: 40px; display: flex; align-items: center; }
details.more[open] > summary { margin-bottom: 6px; }
.d-body { padding: 0 14px 14px; }
.d-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding-bottom: 8px; }
.use-h { margin: 14px 0 2px; }
.entry { border-top: 1px solid var(--line); padding: 10px 0; }
.entry.dim { opacity: .5; }
.e-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.e-pop { font-weight: 600; }
.e-route { color: var(--muted); font-size: 13px; }
.e-dose { font: 600 17px var(--mono); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.e-calc { display: inline-block; margin-top: 4px; padding: 5px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--fg); font: 500 15px var(--mono); }
.e-calc b { color: var(--accent); font-weight: 600; }
.e-note { margin-top: 5px; font-size: 14px; }
.e-src { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 4px; align-items: center; }
.badge { font: 500 12px var(--font); padding: 1px 7px; border-radius: 6px; background: var(--surface2); color: var(--muted); }
.badge.out { background: var(--surface2); color: var(--muted); border: 1px dashed var(--line); }
.badge.cap { background: var(--warn-bg); color: var(--warn-fg); }
.vbox { margin-top: 6px; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.vbox b { font-weight: 600; }
.need { color: var(--warn-fg); background: var(--warn-bg); padding: 2px 8px; border-radius: 6px; font: 500 13px var(--font); }
ul.cautions { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
ul.cautions li { margin-bottom: 4px; }

/* tables */
.tscroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font: 600 12px var(--font); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface2); white-space: nowrap; }
.tbl td.n, .tbl th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr.hl td { background: var(--accent-soft); }

/* sections inside tabs */
.sec { margin-bottom: 14px; }
.sec > h2 { margin-bottom: 8px; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.result { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.result .big { font: 600 22px var(--mono); color: var(--fg); }
.result .lab { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.result.bad { background: var(--danger-bg); }
.result.bad .big { color: var(--danger); }
.result.ok .big { color: var(--ok); }
.pill-ok { color: var(--ok); font-weight: 600; }
.pill-no { color: var(--danger); font-weight: 600; }
.pill-q { color: var(--st-pend); font-weight: 600; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
.legend > div { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
ol.biblio { padding-left: 0; margin: 0; list-style: none; }
ol.biblio li { display: grid; grid-template-columns: 38px 1fr; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
ol.biblio .no { font: 600 13px var(--mono); color: var(--accent); }
.foot { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }

@media (min-width: 720px) {
  .entry { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 18px; }
  .entry > .e-wide { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

</style>
</head>
<body>
<div class="wrap" id="app">
  <noscript><p>This reference tool needs JavaScript.</p></noscript>
  <header class="top">
    <div class="brand">
      <h1>Anesthesia Foundation</h1>
      <p class="sub" id="meta-line"></p>
    </div>
  </header>
  <div id="banner"></div>
  <section class="card patient" id="patient" aria-label="Patient"></section>
  <div class="sticky" id="sticky">
    <div id="sum" class="sum" aria-live="polite"></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Sections"></div>
  </div>
  <main id="view" class="view" role="tabpanel"></main>
  <footer class="foot" id="foot"></footer>
</div>
<script>/* Anesthesia Foundation: calculation engine.
   Pure functions only (no DOM). Shared by the web app and the Node tests.
   Every formula here reproduces a statement from a cited source in /data; the
   source ids are noted next to each rule. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(this, function () {
  'use strict';

  /* ---------- formatting ---------- */
  function fmt(x) {
    if (x === null || x === undefined || !isFinite(x)) return '–';
    var a = Math.abs(x), d;
    if (a >= 100) d = 0; else if (a >= 10) d = 1; else if (a >= 1) d = 2; else if (a >= 0.1) d = 3; else d = 4;
    var s = x.toFixed(d);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }
  function rng(lo, hi) {
    if (hi === null || hi === undefined || Math.abs(hi - lo) < 1e-12) return fmt(lo);
    return fmt(lo) + '–' + fmt(hi);
  }
  function nearestHalf(x) { return Math.round(x * 2) / 2; }

  /* ---------- units ---------- */
  // Parse a dose unit such as "mcg/kg/min", "mg/kg", "mg", "mg/h".
  // Returns null for anything that is not a plain mass (per kg) (per time) unit.
  function parseUnit(u) {
    if (!u) return null;
    var m = /^(mg|mcg|g)(\/kg)?(?:\/(min|h))?$/.exec(String(u).trim());
    if (!m) return null;
    return { mass: m[1], perKg: !!m[2], time: m[3] || null };
  }
  function toMg(v, mass) { return mass === 'mcg' ? v / 1000 : mass === 'g' ? v * 1000 : v; }
  function fromMg(v, mass) { return mass === 'mcg' ? v * 1000 : mass === 'g' ? v / 1000 : v; }
  // concentration object {v, u} -> mg per mL
  function concMgPerMl(c) {
    if (!c || !(c.v > 0)) return null;
    if (c.u === 'mg/mL') return c.v;
    if (c.u === 'mcg/mL') return c.v / 1000;
    if (c.u === 'g/mL') return c.v * 1000;
    return null;
  }
  function ratioToMgPerMl(x) { return x > 0 ? 1000 / x : null; }   // 1:1000 = 1 mg/mL
  function percentToMgPerMl(p) { return p * 10; }                  // 1% = 10 mg/mL
  function mixConcentration(amount, massUnit, volumeMl) {
    if (!(amount > 0) || !(volumeMl > 0)) return null;
    var mg = toMg(amount, massUnit);
    return { mgPerMl: mg / volumeMl, mcgPerMl: mg * 1000 / volumeMl };
  }

  /* ---------- patient ---------- */
  function ageToYears(value, unit) {
    if (!(value >= 0)) return null;
    switch (unit) {
      case 'd': return value / 365.25;
      case 'wk': return value * 7 / 365.25;
      case 'mo': return value / 12;
      default: return value;
    }
  }
  // UI grouping only (not a clinical definition): neonate <= 28 days.
  function ageBand(years, premature) {
    if (years === null || years === undefined) return null;
    if (years < 28 / 365.25) return premature ? 'premature' : 'neonate';
    if (years < 1) return 'infant';
    if (years < 12) return 'child';
    if (years < 18) return 'adolescent';
    return 'adult';
  }
  function entryMatchesAge(e, ageY) {
    if (ageY === null || ageY === undefined) return true;
    if (e.ageMin !== null && e.ageMin !== undefined && ageY < e.ageMin) return false;
    if (e.ageMax !== null && e.ageMax !== undefined && ageY >= e.ageMax) return false;
    return true;
  }

  /* ---------- dose entry calculation ---------- */
  // A computed per-dose maximum applies only to single doses expressed in mass
  // (not cumulative or 24 h ceilings).
  function capApplies(e) {
    if (e.maxAbs === null || e.maxAbs === undefined) return false;
    if (['bolus', 'loading', 'max', 'total'].indexOf(e.kind) < 0) return false;
    var pu = parseUnit(e.unit);
    if (!pu || !pu.perKg || pu.time) return false;
    return /^(mg|mcg)( per dose.*)?$/.test(e.maxUnit || '');
  }
  function capInMass(e, mass) {
    var m = /^(mg|mcg)/.exec(e.maxUnit || 'mg');
    var capMass = m ? m[1] : 'mg';
    return fromMg(toMg(e.maxAbs, capMass), mass);
  }
  // Returns a description of the computed dose for weight wt (kg) and concentration conc ({v,u}).
  function calcEntry(e, wt, conc) {
    if (e.noCalc || e.lo === null || e.lo === undefined) return { type: 'raw' };
    var pu = parseUnit(e.unit);
    if (!pu) return { type: 'raw' };
    if (pu.perKg && !(wt > 0)) return { type: 'needWeight' };
    var c = concMgPerMl(conc);
    var hi = (e.hi === null || e.hi === undefined) ? e.lo : e.hi;
    var scale = pu.perKg ? wt : 1;
    var out = { type: pu.time ? 'rate' : 'amount', mass: pu.mass, time: pu.time, perKg: pu.perKg, capped: false };

geMax":18,"route":"IV","kind":"bolus","lo":0.075,"hi":0.15,"unit":"mg/kg","note":"0.15 mg/kg at reappearance of T3 (sevo/iso/N2O); 0.075-0.125 mg/kg at T1 0.25% under halothane.","src":"fda-rocuronium","status":"label","bookRef":null}],"cautions":[{"text":"Dosing in obese patients: label uses actual body weight for the initial 0.6 mg/kg dose (IBW dosing gave poorer intubating conditions in the cited study).","src":"fda-rocuronium"},{"text":"Geriatric patients: slightly prolonged clinical duration. Renal failure: more variable duration.","src":"fda-rocuronium"},{"text":"Rocuronium is neutralized by sugammadex; see reversal entries.","src":"fda-rocuronium"}]},{"id":"succinylcholine","name":"Succinylcholine","group":"nmb","class":"Depolarizing NMB","conc":[{"v":20,"u":"mg/mL","label":"20 mg/mL"},{"v":1,"u":"mg/mL","label":"1 mg/mL (diluted for infusion)"}],"entries":[{"id":"sux-adult","use":"Intubation / short procedures","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV","kind":"bolus","lo":0.3,"hi":1.1,"unit":"mg/kg","note":"Average 0.6 mg/kg. Onset about 1 min; recovery within 4-6 min. Test dose 5-10 mg may check sensitivity.","src":"fda-anectine","status":"label","bookRef":null},{"id":"sux-int","use":"Intermittent top-up","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV","kind":"bolus","lo":0.04,"hi":0.07,"unit":"mg/kg","note":"After initial 0.3-1.1 mg/kg, at appropriate intervals.","src":"fda-anectine","status":"label","bookRef":null},{"id":"sux-inf","use":"Infusion for long procedures","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV infusion","kind":"fixed-rate","lo":2.5,"hi":4.3,"unit":"mg/min","note":"Average rate; 1 mg/mL solution at 0.5-10 mg/min. Phase II block can develop.","src":"fda-anectine","status":"label","bookRef":null},{"id":"sux-peds-small","use":"Emergency intubation (IV)","pop":"Infants and small children","ageMin":0,"ageMax":2,"route":"IV","kind":"bolus","lo":2,"hi":2,"unit":"mg/kg","note":"Label: reserve use in pediatric patients for emergency intubation / immediately securing airway.","src":"fda-anectine","status":"label","bookRef":null},{"id":"sux-peds-old","use":"Emergency intubation (IV)","pop":"Older children and adolescents","ageMin":2,"ageMax":18,"route":"IV","kind":"bolus","lo":1,"hi":1,"unit":"mg/kg","note":"Label: reserve for emergency intubation (laryngospasm, difficult airway, full stomach).","src":"fda-anectine","status":"label","bookRef":null},{"id":"sux-im","use":"IM when no vein is accessible","pop":"Infants, children, adults","ageMin":0,"ageMax":null,"route":"IM","kind":"bolus","lo":3,"hi":4,"unit":"mg/kg","note":"Label: up to 3-4 mg/kg, but not more than 150 mg total by this route; onset 2-3 min.","src":"fda-anectine","status":"label","maxAbs":150,"maxUnit":"mg","bookRef":null}],"cautions":[{"text":"BOXED WARNING: acute rhabdomyolysis with hyperkalemia, ventricular dysrhythmias, cardiac arrest and death in apparently healthy children with undiagnosed myopathy (e.g., Duchenne). Reserve for emergency pediatric intubation.","src":"fda-anectine"},{"text":"Contraindicated: known/suspected malignant hyperthermia susceptibility, skeletal muscle myopathies, after acute phase of major burns/multiple trauma/denervation/upper motor neuron injury, hypersensitivity.","src":"fda-anectine"},{"text":"Bradycardia, especially in children and after a second dose; pretreat with atropine as appropriate.","src":"fda-anectine"},{"text":"Store refrigerated 2-8 C; multi-dose vials stable up to 14 days at room temperature.","src":"fda-anectine"}]},{"id":"sugammadex","name":"Sugammadex","group":"reversal","class":"Selective relaxant binding agent","conc":[{"v":100,"u":"mg/mL","label":"100 mg/mL"},{"v":10,"u":"mg/mL","label":"10 mg/mL (dilute 1:10 for pediatric accuracy, per label)"}],"entries":[{"id":"sug-moderate","use":"Reversal of rocuronium/vecuronium - moderate block (T2 reappeared)","pop":"Adult and pediatric (US Bridion label: birth and older)","ageMin":0,"ageMax":null,"route":"IV","kind":"bolus","lo":2,"hi":2,"unit":"mg/kg","note":"Dose by actual body weight. US label (2024 supplement) covers pediatric patients from birth; the EU SmPC annex retrieved and Health Canada monograph recommend routine reversal only from 2 years of age. Pediatric studies used 2 and 4 mg/kg. 100 mg/mL may be diluted to 10 mg/mL for pediatric dosing accuracy (EU annex).","wt":"actual","src":"fda-bridion","status":"label","alsoSrc":["fda-bridion-2024","ema-bridion","hc-bridion"],"bookRef":null},{"id":"sug-deep","use":"Reversal of rocuronium/vecuronium - deep block (1-2 PTC, no TOF response)","pop":"Adult and pediatric","ageMin":0,"ageMax":null,"route":"IV","kind":"bolus","lo":4,"hi":4,"unit":"mg/kg","note":"Dose by actual body weight.","wt":"actual","src":"fda-bridion","status":"label","bookRef":null},{"id":"sug-immediate","use":"Immediate reversal ~3 min after rocuronium 1.2 mg/kg","pop":"Adult only (rocuronium only)","ageMin":18,"ageMax":null,"route":"IV","kind":"bolus","lo":16,"hi":16,"unit":"mg/kg","note":"Not studied in pediatric patients or after vecuronium.","wt":"actual","src":"fda-bridion","status":"label","bookRef":null}],"cautions":[{"text":"Not recommended in severe renal impairment (CrCl <30 mL/min) or dialysis. No adjustment for mild or moderate impairment.","src":"fda-bridion"},{"text":"Re-use of rocuronium/vecuronium after reversal: wait times depend on dose and renal function (e.g., 24 h after 16 mg/kg); use a non-steroidal NMBA if sooner.","src":"fda-bridion"},{"text":"Anaphylaxis reported post-marketing, including at doses below 16 mg/kg. Hypersensitivity reactions (nausea, pruritus, urticaria) are dose-related.","src":"fda-bridion"}]},{"id":"neostigmine","name":"Neostigmine","group":"reversal","class":"Cholinesterase inhibitor","conc":[{"v":0.5,"u":"mg/mL","label":"0.5 mg/mL"},{"v":1,"u":"mg/mL","label":"1 mg/mL"}],"entries":[{"id":"neo-short","use":"Reversal of NMBA - shorter half-life agents (e.g., rocuronium) or more than 1 twitch","pop":"Adult and pediatric (all ages)","ageMin":0,"ageMax":null,"route":"IV","kind":"bolus","lo":0.03,"hi":0.03,"unit":"mg/kg","note":"Give slowly over 1 min or more. Maximum total 0.07 mg/kg or 5 mg, whichever is less.","src":"fda-bloxiverz","status":"label","maxAbs":5,"maxUnit":"mg","bookRef":null},{"id":"neo-long","use":"Reversal of NMBA - longer half-life agents or first twitch near 10% of baseline","pop":"Adult and pediatric (all ages)","ageMin":0,"ageMax":null,"route":"IV","kind":"bolus","lo":0.07,"hi":0.07,"unit":"mg/kg","note":"Maximum 0.07 mg/kg or 5 mg, whichever is less. TOF 0.9 expected in 10-20 min.","src":"fda-bloxiverz","status":"label","maxAbs":5,"maxUnit":"mg","bookRef":null}],"cautions":[{"text":"Give atropine or glycopyrrolate before or with neostigmine (separate syringe); give the anticholinergic first if bradycardic.","src":"fda-bloxiverz"},{"text":"Use caution in coronary artery disease, arrhythmias, recent ACS, myasthenia gravis.","src":"fda-bloxiverz"},{"text":"Label: dose selection depends on extent of spontaneous recovery, half-life of the NMBA and need for rapid reversal; adequacy of recovery is judged by muscle tone, respiratory measurements and nerve stimulation.","src":"fda-bloxiverz"}]},{"id":"glycopyrrolate","name":"Glycopyrrolate","group":"reversal","class":"Anticholinergic","conc":[{"v":0.2,"u":"mg/mL","label":"0.2 mg/mL"}],"entries":[{"id":"gly-premed","use":"Preanesthetic antisialagogue (IM)","pop":"Adult and pediatric","ageMin":0,"ageMax":null,"route":"IM","kind":"bolus","lo":0.004,"hi":0.004,"unit":"mg/kg","note":"30-60 min before induction. Children under 2 y may need up to 0.009 mg/kg.","src":"fda-glyco","status":"label","bookRef":null},{"id":"gly-intraop-adult","use":"Intraoperative vagal reflex / bradycardia","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV","kind":"fixed","lo":0.1,"hi":0.1,"unit":"mg","note":"Repeat every 2-3 minutes as needed.","src":"fda-glyco","status":"label","bookRef":null},{"id":"gly-intraop-peds","use":"Intraoperative vagal reflex / bradycardia","pop":"Pediatric","ageMin":0,"ageMax":18,"route":"IV","kind":"bolus","lo":0.004,"hi":0.004,"unit":"mg/kg","note":"Not to exceed 0.1 mg in a single dose; repeat every 2-3 min.","src":"fda-glyco","status":"label","maxAbs":0.1,"maxUnit":"mg","bookRef":null},{"id":"gly-reversal","use":"With neostigmine for reversal","pop":"Adult and pediatric","ageMin":0,"ageMax":null,"route":"IV","kind":"ratio","lo":0.2,"hi":0.2,"unit":"mg per 1 mg neostigmine","note":"0.2 mg glycopyrrolate for each 1 mg neostigmine; may be given together in one injection.","src":"fda-glyco","status":"label","noCalc":true,"bookRef":null}],"cautions":[{"text":"Some vials contain benzyl alcohol: 'not for use in newborns' on some labels. Check the vial.","src":"fda-glyco"},{"text":"Pediatric: paradoxical hyperexcitability and heat prostration can occur.","src":"fda-glyco"}]},{"id":"atropine","name":"Atropine","group":"reversal","class":"Anticholinergic","conc":[{"v":0.4,"u":"mg/mL","label":"0.4 mg/mL"},{"v":1,"u":"mg/mL","label":"1 mg/mL"}],"entries":[{"id":"atr-adult","use":"Antisialagogue / antivagal","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV","kind":"fixed","lo":0.5,"hi":1,"unit":"mg","note":"Initial single dose; titrate to heart rate, PR interval, BP.","src":"fda-atropine","status":"label","bookRef":null},{"id":"atr-peds","use":"Antivagal (pediatric)","pop":"Pediatric (limited data in label)","ageMin":0,"ageMax":18,"route":"IV","kind":"bolus","lo":0.01,"hi":0.03,"unit":"mg/kg","note":"Label: pediatric dosing not well studied; usual initial dose 0.01-0.03 mg/kg. Resuscitation dosing: see emergency module (AHA source).","src":"fda-atropine","status":"label","bookRef":null},{"id":"atr-cad","use":"Total dose limit in coronary artery disease","pop":"Adult with CAD","ageMin":18,"ageMax":null,"route":"IV","kind":"total","lo":0.03,"hi":0.04,"unit":"mg/kg","note":"Limit total dose to 0.03-0.04 mg/kg (about 2-3 mg) to avoid tachycardia-driven ischemia.","src":"fda-atropine","status":"label","bookRef":null}],"cautions":[{"text":"Label lists 1 mg every 3-5 min for bradyasystolic arrest. The 2025 AHA adult cardiac arrest algorithm lists epinephrine, amiodarone and lidocaine as drug therapy and does not list atropine; atropine is in the AHA adult bradycardia algorithm (1 mg bolus every 3-5 min, maximum 3 mg). See emergency module.","src":"aha-acls-ca-2025","alsoSrc":["fda-atropine","aha-acls-brady-2025"]},{"text":"Can precipitate acute glaucoma; in pediatric patients 10 mg or less may be fatal.","src":"fda-atropine"}]},{"id":"ephedrine","name":"Ephedrine","group":"vasoactive","class":"Mixed alpha/beta agonist (indirect)","conc":[{"v":5,"u":"mg/mL","label":"5 mg/mL (1 mL of 50 mg/mL + 9 mL diluent)"},{"v":50,"u":"mg/mL","label":"50 mg/mL (must be diluted for IV bolus)"}],"entries":[{"id":"eph-bolus","use":"Hypotension during anesthesia","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV bolus","kind":"fixed","lo":5,"hi":10,"unit":"mg","note":"Repeat as needed, total not to exceed 50 mg. Titrate to BP goal.","src":"fda-ephedrine","status":"label","maxAbs":50,"maxUnit":"mg total","bookRef":null}],"cautions":[{"text":"Tachyphylaxis possible with repeated doses: have an alternative pressor ready.","src":"fda-ephedrine"},{"text":"Prophylactic use is associated with more hypertension than treatment of established hypotension.","src":"fda-ephedrine"},{"text":"May reduce epidural blockade efficacy by hastening regression of sensory analgesia (label interaction note).","src":"fda-ephedrine"},{"text":"Pediatric safety and effectiveness not established in this label (pediatric bolus doses pending literature entry).","src":"fda-ephedrine"},{"text":"Label notes reports of newborn acidosis (umbilical artery pH 7.2 or less) with maternal ephedrine exposure at Cesarean delivery.","src":"fda-ephedrine"}]},{"id":"phenylephrine","name":"Phenylephrine","group":"vasoactive","class":"Alpha-1 agonist","conc":[{"v":100,"u":"mcg/mL","label":"100 mcg/mL (10 mg in 100 mL, for bolus)"},{"v":20,"u":"mcg/mL","label":"20 mcg/mL (10 mg in 500 mL, for infusion)"},{"v":10,"u":"mg/mL","label":"10 mg/mL stock (must be diluted)"}],"entries":[{"id":"phen-bolus","use":"Hypotension during anesthesia - bolus","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV bolus","kind":"fixed","lo":40,"hi":100,"unit":"mcg","note":"Repeat every 1-2 minutes as needed, total not to exceed 200 mcg.","src":"fda-phenylephrine","status":"label","maxAbs":200,"maxUnit":"mcg total","bookRef":null},{"id":"phen-inf","use":"Hypotension during anesthesia - infusion","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV infusion","kind":"fixed-rate","lo":10,"hi":35,"unit":"mcg/min","note":"Titrate to effect, not to exceed 200 mcg/min. Diluted solution: use within 4 h at room temp or 24 h refrigerated.","src":"fda-phenylephrine","status":"label","maxAbs":200,"maxUnit":"mcg/min","bookRef":null}],"cautions":[{"text":"Correct hypovolemia and acidosis first (acidosis may reduce effectiveness).","src":"fda-phenylephrine"},{"text":"Can cause severe bradycardia with decreased cardiac output; may worsen angina, heart failure, pulmonary hypertension; peripheral and visceral ischemia; extravasation necrosis.","src":"fda-phenylephrine"},{"text":"Cirrhosis (Child-Pugh B/C): decreased responsiveness. End-stage renal disease: increased responsiveness, start at lower end.","src":"fda-phenylephrine"},{"text":"Contains sodium metabisulfite (sulfite allergy risk). Pediatric safety and effectiveness not established in this label.","src":"fda-phenylephrine"}]},{"id":"norepinephrine","name":"Norepinephrine","group":"vasoactive","class":"Catecholamine vasopressor","conc":[{"v":4,"u":"mcg/mL","label":"4 mcg/mL (label: 4 mg in 1000 mL D5W)"},{"v":16,"u":"mcg/mL","label":"16 mcg/mL (4 mg in 250 mL)"},{"v":32,"u":"mcg/mL","label":"32 mcg/mL (8 mg in 250 mL)"},{"v":64,"u":"mcg/mL","label":"64 mcg/mL (16 mg in 250 mL)"},{"v":1000,"u":"mcg/mL","label":"1 mg/mL stock (dilute before use)"}],"entries":[{"id":"norepi-start","use":"Norepinephrine drip - initial rate","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV infusion","kind":"fixed-rate","lo":8,"hi":12,"unit":"mcg/min","note":"Label initial dosage; titrate to maintain low-normal BP (usually systolic 80-100 mmHg in the label wording). Monitor BP every 2 min until stable, then every 5 min.","src":"fda-norepi","status":"label","bookRef":null},{"id":"norepi-maint","use":"Norepinephrine drip - typical maintenance","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV infusion","kind":"fixed-rate","lo":2,"hi":4,"unit":"mcg/min","note":"Label typical maintenance range. Weight-based mcg/kg/min ranges used in sepsis/anesthesia practice are pending literature verification.","src":"fda-norepi","status":"label","bookRef":null},{"id":"norepi-wt-adult","use":"Norepinephrine infusion - weight-based range (shock)","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV infusion","kind":"infusion","lo":0.01,"hi":3.3,"unit":"mcg/kg/min","note":"Wide range quoted for shock; titrate to the MAP target. Dose is expressed as norepinephrine BASE. Surviving Sepsis 2021 recommends norepinephrine as the first-line vasopressor in adult septic shock.","src":"medscape-norepi","alsoSrc":["ssc-2021"],"status":"literature","verifyNote":"Secondary drug-reference range. Typical intraoperative starting rates are not stated in these sources; confirm against Miller/Barash.","bookRef":null},{"id":"norepi-peds-init","use":"Norepinephrine infusion - initial rate (fluid-refractory shock)","pop":"Pediatric","ageMin":0.08,"ageMax":18,"route":"IV/IO infusion","kind":"infusion","lo":0.05,"hi":0.1,"unit":"mcg/kg/min","note":"Titrate to effect. Upper limits differ by source: StatPearls cites 2 mcg/kg/min; BC EHS handbook usual range 0.02-0.4 and maximum 1 mcg/kg/min.","src":"statpearls-norepi","alsoSrc":["bcehs-norepi"],"status":"literature","bookRef":null},{"id":"norepi-neo","use":"Norepinephrine infusion - newborn (hyperdynamic shock, PPHN)","pop":"Neonate (newborn use)","ageMin":0,"ageMax":0.08,"route":"IV infusion","kind":"infusion","lo":0.05,"hi":1,"unit":"mcg/kg/min","note":"Suggested starting dose 0.1 mcg/kg/min, titrated to perfusion as well as BP. Dose is norepinephrine base (acid tartrate 8 mg/4 mL = base 4 mg/4 mL).","src":"anmf-norepi","status":"guideline","bookRef":null}],"cautions":[{"text":"Correct hypovolemia before and during therapy; infuse into a large vein; avoid leg veins in elderly or occlusive disease; avoid catheter tie-in technique.","src":"fda-norepi"},{"text":"Extravasation: infiltrate the area as soon as possible with phentolamine 5-10 mg in 10-15 mL saline (adults) using a fine needle, ideally within 12 h.","src":"fda-norepi"},{"text":"Do not stop abruptly: marked hypotension can follow; wean gradually while expanding volume.","src":"fda-norepi"},{"text":"Dilute in dextrose-containing fluid (reduces oxidation loss); saline alone is not recommended. Stable 24 h at room temperature once diluted, protect from light.","src":"fda-norepi"},{"text":"Pediatric safety and effectiveness not established in this label (pediatric infusion range pending PALS/literature entry).","src":"fda-norepi"},{"text":"Base versus salt: norepinephrine bitartrate (acid tartrate) 2 mg is about 1 mg of base. Check whether the product label and your dose reference use base or salt before programming a pump.","src":"anmf-norepi"}]},{"id":"epinephrine-infusion","name":"Epinephrine infusion","group":"vasoactive","class":"Catecholamine (alpha/beta)","conc":[{"v":1,"u":"mcg/mL","label":"1 mcg/mL (label dilution for infusion)"},{"v":16,"u":"mcg/mL","label":"16 mcg/mL (4 mg in 250 mL)"},{"v":100,"u":"mcg/mL","label":"100 mcg/mL (1 mg/10 mL syringe)"}],"entries":[{"id":"epi-shock","use":"Hypotension of septic shock - infusion","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV infusion","kind":"infusion","lo":0.05,"hi":2,"unit":"mcg/kg/min","note":"Titrate every 10-15 min in 0.05-0.2 mcg/kg/min steps to MAP goal; dilute in dextrose; large vein; wean gradually.","src":"fda-epi-shock","status":"label","bookRef":null}],"cautions":[{"text":"Pediatric safety and effectiveness for septic shock not established in this label. Anaphylaxis and cardiac arrest dosing are in the emergency module (separate sources).","src":"fda-epi-shock"},{"text":"Avoid in obstetrics when maternal BP exceeds 130/80 mmHg (uterine vasoconstriction); avoid catheter tie-in technique.","src":"fda-epi-shock"}]},{"id":"morphine","name":"Morphine","group":"opioid","class":"Opioid (mu agonist)","conc":[{"v":1,"u":"mg/mL","label":"1 mg/mL"},{"v":2,"u":"mg/mL","label":"2 mg/mL"},{"v":4,"u":"mg/mL","label":"4 mg/mL"}],"entries":[{"id":"mor-iv-wt","use":"Analgesia - direct IV injection (initial)","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV","kind":"bolus","lo":0.1,"hi":0.2,"unit":"mg/kg","note":"Label: every 4 hours as needed, lowest dose that gives adequate analgesia; inject slowly (maximal CNS effect is delayed about 30 min, so rapid or repeated dosing can overdose).","src":"fda-morphine","status":"label","bookRef":null},{"id":"mor-iv-70","use":"Analgesia - IV initial (preservative-free label wording)","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV","kind":"fixed","lo":2,"hi":10,"unit":"mg","note":"Label wording: 2-10 mg per 70 kg.","src":"fda-morphine","status":"label","bookRef":null},{"id":"mor-pca","use":"PCA bolus (opioid-naive)","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV (PCA)","kind":"fixed","lo":0.2,"hi":3,"unit":"mg","note":"Usual 1 mg bolus, lockout 6 min. Opioid-naive: limit maximal dosing rate to 10 mg/h. 2-3 mg boluses in tolerant patients (up to 5 mg used in studies).","src":"fda-morphine","status":"label","bookRef":null},{"id":"mor-epidural","use":"Epidural (preservative-free only)","pop":"Adult","ageMin":18,"ageMax":null,"route":"Epidural","kind":"fixed","lo":5,"hi":5,"unit":"mg","note":"Initial lumbar injection 5 mg; incremental 1-2 mg if inadequate after 1 h; do not exceed 10 mg per 24 h.","src":"fda-morphine","status":"label","maxAbs":10,"maxUnit":"mg/24 h","bookRef":null},{"id":"mor-intrathecal","use":"Intrathecal (preservative-free only)","pop":"Adult","ageMin":18,"ageMax":null,"route":"Intrathecal","kind":"fixed","lo":0.2,"hi":1,"unit":"mg","note":"Usually about 1/10 of the epidural dose; single injection may give up to 24 h analgesia.","src":"fda-morphine","status":"label","bookRef":null}],"cautions":[{"text":"Pediatric: safety and effectiveness below 18 y not established in these labels; spinal morphine not recommended in children. Weight-based pediatric morphine doses are pending literature entry.","src":"fda-morphine"},{"text":"Elderly may have increased sensitivity. Avoid mg versus mL confusion between different concentrations.","src":"fda-morphine"}]},{"id":"epinephrine-bolus","name":"Epinephrine (anaphylaxis, IM)","group":"emergency","class":"Catecholamine","conc":[{"v":1,"u":"mg/mL","label":"1 mg/mL (1:1000)"}],"entries":[{"id":"epi-ana-adult","use":"Anaphylaxis - IM/SC anterolateral thigh","pop":"Adults and children 30 kg or more","ageMin":0,"ageMax":null,"route":"IM","kind":"fixed","lo":0.3,"hi":0.5,"unit":"mg","note":"Label: 0.3-0.5 mg; repeat every 5-10 min as necessary; monitor cardiac effects. Children under 30 kg: see the weight-based IM entry from the ASCIA guideline below (label lines for lighter children were not captured).","src":"fda-adrenalin","status":"label","bookRef":null},{"id":"epi-ana-peds","use":"Anaphylaxis - IM anterolateral thigh (weight-based)","pop":"Pediatric","ageMin":0,"ageMax":18,"route":"IM","kind":"bolus","lo":0.01,"hi":0.01,"unit":"mg/kg","note":"ASCIA: 1:1000 adrenaline 0.01 mg/kg (0.01 mL/kg) up to 0.5 mg per dose. Repeat as needed (ANZCA/ANZAAG: every 5 min).","src":"ascia-acute","status":"guideline","maxAbs":0.5,"maxUnit":"mg per dose","bookRef":null},{"id":"epi-ana-periop-adult","use":"Perioperative anaphylaxis - IM lateral thigh","pop":"Adult","ageMin":18,"ageMax":null,"route":"IM","kind":"fixed","lo":0.5,"hi":0.5,"unit":"mg","note":"ANZAAG/ANZCA recommend 500 mcg IM, repeated every 5 min as needed. Titrated IV adrenaline is the mainstay for moderate to life-threatening reactions under anesthesia; IM is for when IV access or monitoring is not yet available or while the infusion is prepared. After three boluses (IV or IM) prepare an infusion.","src":"anzca-ana-bp-2022","status":"guideline","verifyNote":"Adult IV bolus and infusion dose lines are on the ANZAAG cards and were not retrievable; use your institution's card.","bookRef":null},{"id":"epi-ana-peds-iv","use":"Perioperative anaphylaxis - IV bolus (published range)","pop":"Pediatric","ageMin":0,"ageMax":18,"route":"IV","kind":"bolus","lo":1,"hi":10,"unit":"mcg/kg","note":"Published IV bolus recommendations for children range 1-10 mcg/kg depending on reaction severity (French, Scandinavian, AAGBI guidelines as summarized by ANZCA). ASCIA: IV boluses not recommended outside specialist settings; where used (theatre), 1 mcg/kg (max 50 mcg) over 1-2 min.","src":"anzca-ana-bp-2022","alsoSrc":["ascia-refractory","anzca-pg69"],"status":"guideline","verifyNote":"Severity-graded values are on the ANZCA/ANZAAG paediatric cards (not retrievable). Treat as a range only; ANZCA PG69 notes pediatric emergency drug preparation is error-prone: use your institutional card.","bookRef":null}],"cautions":[{"text":"Label: weight-based dosing is supported for pediatric anaphylaxis; septic shock use in children not established.","src":"fda-adrenalin"},{"text":"Fluid: repeated 20 mL/kg boluses may be required (ANZCA/ANZAAG; ASCIA suggests 10-20 mL/kg if hypotensive).","src":"anzca-ana-bp-2022"},{"text":"Pediatric IV infusion: French guidelines (as cited by ANZCA) start at 0.1 mcg/kg/min and titrate up to 2 mcg/kg/min; no infusion dosing in the Scandinavian or AAGBI guidelines.","src":"anzca-ana-bp-2022"}]},{"id":"dantrolene","name":"Dantrolene","group":"emergency","class":"Ryanodine receptor antagonist (malignant hyperthermia)","conc":[{"v":0.333,"u":"mg/mL","label":"20 mg per 60 mL (Revonto-type vial reconstituted)"}],"entries":[{"id":"dant-mh","use":"Malignant hyperthermia crisis - IV push","pop":"All ages (label)","ageMin":0,"ageMax":null,"route":"IV","kind":"bolus","lo":1,"hi":10,"unit":"mg/kg","note":"Label: continuous rapid IV push starting at a minimum of 1 mg/kg, continue until symptoms subside or maximum cumulative 10 mg/kg is reached; repeat if signs reappear. MHAUS recommends 2.5 mg/kg as the initial and repeat dose (see MHAUS entry below).","src":"fda-dantrolene","status":"label","maxAbs":null,"bookRef":null},{"id":"dant-prophylaxis","use":"Pre-op IV prophylaxis (MH susceptible)","pop":"Adult/pediatric (label)","ageMin":0,"ageMax":null,"route":"IV infusion","kind":"bolus","lo":2.5,"hi":2.5,"unit":"mg/kg","note":"Start about 1.25 h before anesthesia, infuse over about 1 h. Avoid triggering agents regardless.","src":"fda-dantrolene","status":"label","bookRef":null},{"id":"dant-post","use":"Postoperative IV after crisis","pop":"All ages","ageMin":0,"ageMax":null,"route":"IV","kind":"bolus","lo":1,"hi":1,"unit":"mg/kg","note":"Starting 1 mg/kg or more, individualized. Oral follow-up 4-8 mg/kg/day in four divided doses for 1-3 days.","src":"fda-dantrolene","status":"label","bookRef":null},{"id":"dant-mhaus-initial","use":"MH crisis - initial and repeat dose (MHAUS)","pop":"All ages","ageMin":0,"ageMax":null,"route":"IV","kind":"bolus","lo":2.5,"hi":2.5,"unit":"mg/kg","note":"Give rapidly through a large-bore IV; repeat as often as needed until ETCO2 falls, rigidity eases and/or heart rate falls. The label caps cumulative dosing at 10 mg/kg; MHAUS notes that occasional patients required more than 20 mg/kg.","src":"mhaus-crisis","alsoSrc":["mh-review-2019","ryanodex-label","mhaus-kb"],"status":"guideline","bookRef":null},{"id":"dant-mhaus-maint","use":"After initial control - maintenance dantrolene","pop":"All ages","ageMin":0,"ageMax":null,"route":"IV","kind":"bolus","lo":1,"hi":1,"unit":"mg/kg","note":"MHAUS: continue 1 mg/kg per dose every 4-6 h for at least 24 h while watching for recrudescence; may stop or lengthen the interval to 8-12 h when stable 24 h, core temp under 38 C, CK falling, no myoglobinuria and rigidity gone. The product should be used within 6 h of reconstitution.","src":"mhaus-post","status":"guideline","bookRef":null},{"id":"dant-ryanodex-prophylaxis","use":"Prophylaxis (Ryanodex product)","pop":"High-risk patients","ageMin":0,"ageMax":null,"route":"IV","kind":"bolus","lo":2.5,"hi":2.5,"unit":"mg/kg","note":"Ryanodex label: over at least 1 minute, starting about 75 minutes before surgery. (The Revonto-type label above uses about 1.25 h before, infused over about 1 h.) Avoid triggering agents regardless.","src":"ryanodex-label","status":"label","bookRef":null}],"cautions":[{"text":"Revonto-type 20 mg vial: reconstitute with 60 mL sterile water (no bacteriostatic agent); shake about 20 s until clear; do NOT use D5W or saline; protect from light; use within 6 h.","src":"fda-dantrolene"},{"text":"Expect muscle weakness postoperatively (label patient information).","src":"fda-dantrolene"},{"text":"Other formulations (for example 250 mg vial products) have different reconstitution volumes: check the product in your OR cart.","src":"fda-dantrolene"},{"text":"MHAUS 24-hour MH hotline (US): 800-644-9737, for emergencies only. Follow your institutional MH cart and checklist.","src":"mhaus-kb"}]},{"id":"lidocaine","name":"Lidocaine (local anesthetic)","group":"local","class":"Amide local anesthetic","laMax":true,"conc":[{"v":5,"u":"mg/mL","label":"0.5%"},{"v":10,"u":"mg/mL","label":"1%"},{"v":15,"u":"mg/mL","label":"1.5%"},{"v":20,"u":"mg/mL","label":"2%"}],"entries":[{"id":"lido-max-plain","use":"Maximum single dose - without epinephrine","pop":"Normal healthy adult","ageMin":18,"ageMax":null,"route":"Infiltration / nerve block","kind":"max","lo":4.5,"hi":4.5,"unit":"mg/kg","note":"Label: 4.5 mg/kg (2 mg/lb); in general total not to exceed 300 mg. For continuous epidural/caudal, do not repeat the maximum dose at intervals under 90 min.","src":"fda-xylocaine","status":"label","maxAbs":300,"maxUnit":"mg","bookRef":null,"epi":"plain"},{"id":"lido-max-epi","use":"Maximum single dose - with epinephrine","pop":"Normal healthy adult","ageMin":18,"ageMax":null,"route":"Infiltration / nerve block","kind":"max","lo":7,"hi":7,"unit":"mg/kg","note":"Label: 7 mg/kg (3.5 mg/lb); in general total not to exceed 500 mg.","src":"fda-xylocaine","status":"label","maxAbs":500,"maxUnit":"mg","bookRef":null,"epi":"with"},{"id":"lido-peds","use":"Maximum dose - children over 3 y","pop":"Pediatric >3 y, normal lean body mass","ageMin":3,"ageMax":18,"route":"Infiltration / nerve block","kind":"max","lo":3.3,"hi":4.4,"unit":"mg/kg","note":"Label gives no single pediatric maximum: it depends on age and weight. Label example: 5 y, 50 lb child should not exceed 75-100 mg (1.5-2 mg/lb = 3.3-4.4 mg/kg). Reduce for debilitated or ill children.","src":"fda-xylocaine","status":"label","bookRef":null,"epi":"any"},{"id":"lido-ivra","use":"Intravenous regional anesthesia (Bier block)","pop":"Adult","ageMin":18,"ageMax":null,"route":"IV regional","kind":"max","lo":4,"hi":4,"unit":"mg/kg","note":"Use only the preservative-free 0.5% solution (50 mL single-dose vial per label).","src":"fda-xylocaine","status":"label","bookRef":null,"epi":"any"},{"id":"lido-ivra-peds","use":"Intravenous regional anesthesia (Bier block)","pop":"Pediatric","ageMin":0,"ageMax":18,"route":"IV regional","kind":"max","lo":3,"hi":3,"unit":"mg/kg","note":"Label: more dilute solutions (0.25-0.5%), total not to exceed 3 mg/kg.","src":"fda-xylocaine","status":"label","bookRef":null,"epi":"any"},{"id":"lido-test","use":"Epidural test dose","pop":"Adult","ageMin":18,"ageMax":null,"route":"Epidural","kind":"fixed","lo":2,"hi":3,"unit":"mL of 1.5%","note":"Wait at least 5 min before the full dose. Epinephrine 10-15 mcg in the test dose can signal intravascular injection (heart rate and systolic BP rise within about 45 s in an unsedated patient).","src":"fda-xylocaine","status":"label","noCalc":true,"bookRef":null}],"cautions":[{"text":"Methemoglobinemia reported with local anesthetics; caution in severe hepatic disease, shock, heart block; reduce doses in children, elderly, debilitated.","src":"fda-xylocaine"},{"text":"Early CNS toxicity signs: restlessness, anxiety, tinnitus, dizziness, blurred vision, tremors, drowsiness. Have oxygen and resuscitation equipment (and lipid emulsion per your LAST protocol) immediately available.","src":"fda-xylocaine"}]},{"id":"bupivacaine","name":"Bupivacaine (local anesthetic)","group":"local","class":"Amide local anesthetic","laMax":true,"conc":[{"v":2.5,"u":"mg/mL","label":"0.25%"},{"v":5,"u":"mg/mL","label":"0.5%"},{"v":7.5,"u":"mg/mL","label":"0.75%"}],"entries":[{"id":"bupi-day","use":"Maximum total daily dose","pop":"Average adult","ageMin":18,"ageMax":null,"route":"Infiltration / blocks / epidural","kind":"max","lo":400,"hi":400,"unit":"mg/24 h","note":"Label: doses may be repeated once every 3 hours; do not exceed 400 mg in 24 hours.","src":"fda-marcaine","status":"label","noCalc":true,"bookRef":null,"epi":"any"},{"id":"bupi-obs","use":"Obstetric epidural increments","pop":"Obstetric","ageMin":18,"ageMax":null,"route":"Epidural","kind":"fixed","lo":50,"hi":100,"unit":"mg","note":"Use ONLY 0.5% and 0.25%: incremental 3-5 mL of 0.5% not exceeding 50-100 mg at any interval, after an epinephrine-containing test dose.","src":"fda-marcaine","status":"label","noCalc":true,"bookRef":null},{"id":"bupi-test","use":"Epidural test dose","pop":"Adult","ageMin":18,"ageMax":null,"route":"Epidural","kind":"fixed","lo":3,"hi":3,"unit":"mL of 0.5% with 1:200,000 epinephrine","note":"Contains 15 mg bupivacaine and 15 mcg epinephrine; a negative test does not exclude intravascular or intrathecal placement.","src":"fda-marcaine","status":"label","noCalc":true,"bookRef":null},{"id":"bupi-max-plain","use":"Maximum single dose - without epinephrine","pop":"Adult","ageMin":18,"ageMax":null,"route":"Infiltration / nerve block","kind":"max","lo":2,"hi":2.5,"unit":"mg/kg","note":"Sources differ: CMAJ 2022 gives 2 mg/kg; StatPearls and WikEM give 2.5 mg/kg (not to exceed 175 mg). The calculator shows the conservative 2 mg/kg first. 24 h ceiling 400 mg (label).","src":"cmaj-last-2022","alsoSrc":["statpearls-la-max","wikem-bupi"],"status":"literature","maxAbs":175,"maxUnit":"mg per dose (StatPearls)","bookRef":null,"epi":"plain"},{"id":"bupi-max-epi","use":"Maximum single dose - with epinephrine","pop":"Adult","ageMin":18,"ageMax":null,"route":"Infiltration / nerve block","kind":"max","lo":3,"hi":3,"unit":"mg/kg","note":"StatPearls: not to exceed 225 mg per dose; maximum 24 h dose 400 mg.","src":"statpearls-la-max","alsoSrc":["cmaj-last-2022"],"status":"literature","maxAbs":225,"maxUnit":"mg per dose (StatPearls)","bookRef":null,"epi":"with"},{"id":"bupi-max-peds","use":"Maximum dose - single-injection peripheral nerve block","pop":"Pediatric","ageMin":0,"ageMax":18,"route":"Peripheral nerve block","kind":"max","lo":2.5,"hi":2.5,"unit":"mg/kg","note":"MARAA chapter: maximum dose of bupivacaine 2.5 mg/kg for pediatric peripheral nerve blocks.","src":"maraa-ch30","status":"literature","verifyNote":"Pediatric maximums are consensus values with weak evidence (ESRA/ASRA: high-level evidence not yet available).","bookRef":null,"epi":"any"},{"id":"bupi-pnb-peds","use":"Ultrasound-guided upper-extremity block (axillary, infraclavicular, interscalene, supraclavicular)","pop":"Pediatric","ageMin":0,"ageMax":18,"route":"Peripheral nerve block","kind":"bolus","lo":0.5,"hi":1.5,"unit":"mg/kg","note":"Recommended LA dose of bupivacaine or ropivacaine per ESRA/ASRA joint advisory.","src":"esra-asra-peds-la","status":"guideline","bookRef":null},{"id":"bupi-spinal-infant","use":"Spinal anesthesia - newborn and infant","pop":"Newborn / infant (about 1 y or less)","ageMin":0,"ageMax":1,"route":"Intrathecal","kind":"bolus","lo":1,"hi":1,"unit":"mg/kg","note":"ESRA/ASRA: bupivacaine 1 mg/kg for newborn and/or infant. Children have a large CSF volume relative to adults.","src":"esra-asra-peds-la","status":"guideline","bookRef":null},{"id":"bupi-spinal-child","use":"Spinal anesthesia - older children","pop":"Pediatric over 1 y","ageMin":1,"ageMax":18,"route":"Intrathecal","kind":"bolus","lo":0.5,"hi":0.5,"unit":"mg/kg","note":"ESRA/ASRA: bupivacaine 0.5 mg/kg in children older than 1 year.","src":"esra-asra-peds-la","status":"guideline","bookRef":null}],"cautions":[{"text":"BOXED WARNING: cardiac arrest with difficult or impossible resuscitation in obstetric epidural use, mostly with the 0.75% concentration. 0.75% not recommended for obstetric anesthesia.","src":"fda-marcaine"},{"text":"Contraindicated for obstetric paracervical block and for intravenous regional anesthesia (Bier block).","src":"fda-marcaine"},{"text":"Not for intrathecal use (this product). Use preservative-free single-dose vials for epidural/caudal. Pediatric use under 12 y not recommended in the label; continuous infusions in children have caused high systemic levels and seizures.","src":"fda-marcaine"},{"text":"Per-kg maximum single dose (for example 2.5 mg/kg plain) is not in the extracted label text: pending literature/book verification.","src":"fda-marcaine"},{"text":"The US Marcaine label does not recommend use under 12 y; the pediatric regional doses above come from the ESRA/ASRA advisory and MARAA text. These two sources are in tension: follow your institutional pediatric regional protocol.","src":"esra-asra-peds-la"}]},{"id":"ropivacaine","name":"Ropivacaine (local anesthetic)","group":"local","class":"Amide local anesthetic","laMax":true,"conc":[{"v":2,"u":"mg/mL","label":"0.2%"},{"v":5,"u":"mg/mL","label":"0.5%"},{"v":7.5,"u":"mg/mL","label":"0.75%"},{"v":10,"u":"mg/mL","label":"1%"}],"entries":[{"id":"ropi-infusion","use":"Postoperative epidural infusion (lumbar or thoracic)","pop":"Adult","ageMin":18,"ageMax":null,"route":"Epidural infusion","kind":"infusion","lo":12,"hi":28,"unit":"mg/h","note":"0.2% (2 mg/mL) at 6-14 mL/h; well tolerated up to 72 h.","src":"fda-naropin","status":"label","bookRef":null},{"id":"ropi-cumulative","use":"Maximum cumulative dose over 24 h (block plus infusion)","pop":"Adult","ageMin":18,"ageMax":null,"route":"Epidural / block","kind":"max","lo":770,"hi":770,"unit":"mg/24 h","note":"Label: cumulative 770 mg over 24 h well tolerated for postoperative pain; use caution for prolonged periods (over 70 h) in debilitated patients.","src":"fda-naropin","status":"label","noCalc":true,"bookRef":null,"epi":"any"},{"id":"ropi-infiltration","use":"Local infiltration studies","pop":"Adult","ageMin":18,"ageMax":null,"route":"Infiltration","kind":"max","lo":200,"hi":200,"unit":"mg","note":"Clinical studies used doses up to 200 mg (concentrations up to 5 mg/mL).","src":"fda-naropin","status":"label","noCalc":true,"bookRef":null,"epi":"any"},{"id":"ropi-brachial","use":"Brachial plexus block - upper dose caution","pop":"Adult","ageMin":18,"ageMax":null,"route":"Plexus block","kind":"max","lo":300,"hi":300,"unit":"mg","note":"Label PK: after a 300 mg brachial plexus block, free plasma concentrations in some patients may approach the CNS toxicity threshold.","src":"fda-naropin","status":"label","noCalc":true,"bookRef":null,"epi":"any"},{"id":"ropi-max","use":"Maximum single dose (with or without epinephrine)","pop":"Adult","ageMin":18,"ageMax":null,"route":"Infiltration / nerve block","kind":"max","lo":3,"hi":3,"unit":"mg/kg","note":"CMAJ 2022 and WikEM both give 3 mg/kg with or without epinephrine. Cumulative 24 h ceiling in the US label is 770 mg (postoperative pain).","src":"cmaj-last-2022","alsoSrc":["wikem-bupi"],"status":"literature","bookRef":null,"epi":"any"},{"id":"ropi-max-peds-epid","use":"Maximum dose - pediatric epidural (2 mg/mL)","pop":"Pediatric","ageMin":0,"ageMax":18,"route":"Epidural","kind":"max","lo":2.5,"hi":2.5,"unit":"mg/kg","note":"Abstract snippet: epidural blocks with 2 mg/mL ropivacaine, maximum 2.5 mg/kg.","src":"marhofer-2025","status":"literature","verifyNote":"Taken from a search snippet of the abstract; verify against the full text before relying on it.","bookRef":null,"epi":"any"},{"id":"ropi-pnb-peds","use":"Ultrasound-guided upper-extremity block (axillary, infraclavicular, interscalene, supraclavicular)","pop":"Pediatric","ageMin":0,"ageMax":18,"route":"Peripheral nerve block","kind":"bolus","lo":0.5,"hi":1.5,"unit":"mg/kg","note":"Recommended LA dose of bupivacaine or ropivacaine per ESRA/ASRA joint advisory.","src":"esra-asra-peds-la","status":"guideline","bookRef":null}],"cautions":[{"text":"Per-procedure dosing table (lumbar epidural, thoracic, major nerve block, field block) and pediatric dosing were not fully extracted: pending label review.","src":"fda-naropin"},{"text":"Not for intravenous administration; 1% (10 mg/mL) is for epidural use only.","src":"fda-naropin"}]}],"emergency":{"protocols":[{"id":"last","title":"Local anesthetic systemic toxicity (LAST): lipid emulsion","pop":"Adult and pediatric","src":"asra-last-2020","status":"guideline","intro":"ASRA 2020 checklist: call for help, get the LAST rescue kit, consider the cardiopulmonary bypass team, and consider giving 20% lipid emulsion early. Order (bolus or infusion) and method of infusion are not critical. LAST resuscitation differs from standard ACLS.","items":[{"label":"20% lipid emulsion - bolus","wtMin":70,"fixed":100,"unit":"mL","when":"over 2-3 min","note":"70 kg or more: ~100 mL"},{"label":"20% lipid emulsion - infusion","wtMin":70,"fixed":250,"unit":"mL","when":"over 15-20 min","note":"70 kg or more: ~250 mL"},{"label":"20% lipid emulsion - bolus","wtMax":70,"perKg":1.5,"unit":"mL","when":"over 2-3 min","note":"Under 70 kg: ~1.5 mL/kg"},{"label":"20% lipid emulsion - infusion","wtMax":70,"perKg":0.25,"unit":"mL/min","when":"continuous (about 15 mL/kg/h); consider a pump if under 40 kg","note":"Under 70 kg: ~0.25 mL/kg/min"},{"label":"If still unstable","text":"Repeat the bolus and double the infusion rate. Continue the infusion for at least 15 min after hemodynamic stability."},{"label":"Maximum lipid dose","perKg":12,"unit":"mL","note":"Upper limit 12 mL/kg"},{"label":"Epinephrine for arrhythmia or hypotension","perKgLt":1,"unit":"mcg","note":"Smaller than normal doses preferred: start with under 1 mcg/kg"},{"label":"Seizure","text":"Secure the airway. Benzodiazepine preferred. If only propofol is available, use low dose (for example 20 mg increments)."},{"label":"Avoid","text":"Further local anesthetic, beta-blockers, calcium channel blockers, vasopressin."},{"label":"Observe after stable","text":"At least 2 h after a seizure; 4-6 h after cardiovascular instability; as appropriate after cardiac arrest."}]},{"id":"mh","title":"Malignant hyperthermia: dantrolene","pop":"All ages","src":"mhaus-crisis","status":"guideline","intro":"Dantrolene is given with supportive measures. The Ryanodex label lists discontinuing MH-triggering agents, managing metabolic acidosis, cooling if necessary and administering diuretics; follow your institutional MH cart and checklist. 24-h MHAUS hotline: 800-644-9737.","items":[{"label":"Dantrolene - initial dose","perKg":2.5,"unit":"mg","vialMg":20,"note":"2.5 mg/kg rapid IV push (MHAUS); repeat until ETCO2, rigidity and heart rate respond"},{"label":"Dantrolene - repeat threshold","perKg":2.5,"unit":"mg","vialMg":20,"note":"Repeat 2.5 mg/kg as often as needed"},{"label":"Cumulative label ceiling","perKg":10,"unit":"mg","vialMg":20,"note":"Label maximum cumulative 10 mg/kg; some patients need more (MHAUS)"},{"label":"Maintenance","perKg":1,"unit":"mg","when":"every 4-6 h for at least 24 h","vialMg":20,"note":"1 mg/kg per dose (MHAUS)"}]},{"id":"ana","title":"Anaphylaxis: epinephrine and fluids","pop":"Pediatric dosing by weight; adult IM fixed","src":"ascia-acute","status":"guideline","intro":"Epinephrine is first-line. Under anesthesia, titrated IV epinephrine is the mainstay for moderate to life-threatening reactions (ANZAAG/ANZCA); IM is used when IV access or monitoring is not ready. Verify against your institutional anaphylaxis card.","items":[{"label":"Epinephrine IM (1 mg/mL)","perKg":0.01,"unit":"mg","max":0.5,"conc":1,"concUnit":"mg/mL","when":"repeat every 5 min as needed","note":"0.01 mg/kg up to 0.5 mg per dose (ASCIA); adults: 0.5 mg (ANZAAG/ANZCA)"},{"label":"Epinephrine IV bolus (pediatric, specialist setting)","perKg":1,"unit":"mcg","max":50,"when":"over 1-2 min","note":"ASCIA refractory flowchart: 1 mcg/kg up to 50 mcg. Published pediatric range is 1-10 mcg/kg by severity: card values not retrieved","verifyNote":"Severity-graded pediatric card values were not retrieved: confirm against the ANZAAG/ASCIA card before use."},{"label":"Epinephrine infusion (pediatric)","perKg":0.1,"perKgHi":2,"unit":"mcg/min","note":"French guideline as cited by ANZCA: start 0.1 mcg/kg/min, titrate to a maximum of 2 mcg/kg/min","verifyNote":"Single secondary citation (ANZCA summary of a French guideline): confirm against a primary source before use."},{"label":"Fluid bolus","perKg":20,"unit":"mL","note":"20 mL/kg crystalloid, repeat as needed (ANZCA/ANZAAG); ASCIA: 10-20 mL/kg if hypotensive"}]},{"id":"pals","title":"Pediatric cardiac arrest (AHA 2025 PALS)","pop":"Infants and children (pediatric algorithm)","src":"aha-pals-2025","status":"guideline","intro":"Compression rate 100-120/min, depth at least one third of the chest. CPR 15:2 with two rescuers before puberty, 30:2 after onset of puberty or with one rescuer; with an advanced airway give continuous compressions and a breath every 2-3 s.","items":[{"label":"Epinephrine IV/IO (0.1 mg/mL)","perKg":0.01,"unit":"mg","max":1,"conc":0.1,"concUnit":"mg/mL","when":"every 3-5 min","note":"0.01 mg/kg = 0.1 mL/kg of 0.1 mg/mL; maximum 1 mg"},{"label":"Amiodarone IV/IO (shock-refractory VF/pVT)","perKg":5,"unit":"mg","max":300,"note":"5 mg/kg bolus, max 300 mg; up to 3 doses, later doses max 150 mg","verifyNote":"Flagged for a second check: confirm the repeat-dose wording against the current AHA PALS drug table."},{"label":"Lidocaine IV/IO (alternative to amiodarone)","perKg":1,"unit":"mg","note":"1 mg/kg"},{"label":"Defibrillation - first shock","perKg":2,"unit":"J"},{"label":"Defibrillation - second shock","perKg":4,"unit":"J"},{"label":"Defibrillation - subsequent shocks","perKg":4,"unit":"J","perKgMax":10,"note":"4 J/kg or more, maximum 10 J/kg or the adult dose"}]},{"id":"acls","title":"Adult cardiac arrest (AHA 2025 ACLS)","pop":"Adult","src":"aha-acls-ca-2025","status":"guideline","intro":"High-quality CPR: push hard (at least 2 inches / 5 cm) and fast (100-120/min), allow full recoil, minimize interruptions, change compressors every 2 min. 30:2 without an advanced airway; with an advanced airway give 1 breath every 6 s (10/min) with continuous compressions. Monitor waveform capnography.","items":[{"label":"Epinephrine IV/IO","fixed":1,"unit":"mg","conc":0.1,"concUnit":"mg/mL","when":"every 3-5 min","note":"1 mg = 10 mL of 0.1 mg/mL"},{"label":"Amiodarone IV/IO - first dose","fixed":300,"unit":"mg","note":"Bolus (shock-refractory VF/pVT)"},{"label":"Amiodarone IV/IO - second dose","fixed":150,"unit":"mg"},{"label":"Lidocaine IV/IO - first dose (alternative)","perKg":1,"perKgHi":1.5,"unit":"mg","note":"1-1.5 mg/kg"},{"label":"Lidocaine IV/IO - second dose","perKg":0.5,"perKgHi":0.75,"unit":"mg","note":"0.5-0.75 mg/kg"},{"label":"Defibrillation energy","text":"Biphasic: manufacturer recommendation (for example initial 120-200 J); if unknown use the maximum available. Second and subsequent doses should be equivalent; higher doses may be considered. Monophasic: 360 J."}]},{"id":"brady","title":"Adult bradycardia with a pulse (AHA 2025)","pop":"Adult","src":"aha-acls-brady-2025","status":"guideline","intro":"For bradycardia with cardiopulmonary compromise (hypotension, acutely altered mental status, sign   });
  var html = '';

    if (inner) html += '<h4 class="use-h">' + esc(u) + '</h4>' + inner;
  });
  return html;
}

function setPath(path, val) {
  var parts = path.split('.'), o = S;
  for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];

}

function renderBanner() {

}

function ageLabel() {

}
var BAND_TEXT = { premature: 'premature neonate', neonate: 'neonate', infant: 'infant', child: 'child', adolescent: 'adolescent', adult: 'adult' };
function renderSummary() {

function renderTabs() {

};
CHG.patient = function () {};

function onPatientChanged() {
  deriveSet();
  renderBanner();

  renderView();
}

function handleBound(ev) {
  var el = ev.target;
  if (!el || !el.getAttribute) return;
  var k = el.getAttribute('data-k');
  var isText = el.tagName === 'INPUT' && el.type !== 'checkbox';
  var isChoice = el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'checkbox');
  if (ev.type === 'input' && !isText) return;
  if (ev.type === 'change' && isText) return;
  if (k) {
    var val = el.type === 'checkbox' ? el.checked : el.value;
    setPath(k, val);
    var a = el.getAttribute('data-a');
    if (a === 'patient') { S.example = false; onPatientChanged(); return; }
    var out = el.getAttribute('data-out');
    if (out && OUT[out]) OUT[out](el);
    else if (a === 'view') renderView();
    return;
  }
  var ch = el.getAttribute('data-act-change');
  if (ch && isChoice && CHG[ch]) CHG[ch](el);
}
function handleClick(ev) {
  var t = ev.target;
  var el = t.closest ? t.closest('[data-act]') : null;
  if (el && ACT[el.getAttribute('data-act')]) ACT[el.getAttribute('data-act')](el, ev);
}

document.addEventListener('input', handleBound);
document.addEventListener('change', handleBound);
document.addEventListener('click', handleClick);
document.addEventListener('toggle', function (ev) {
  var d = ev.target;
  if (!d || !d.getAttribute) return;
  var id = d.getAttribute('data-drug');
  if (d.tagName === 'DETAILS' && id && d.classList.contains('drug')) {
    S.open[id] = d.open;
    var body = d.querySelector('.d-body');
    if (d.open && body && !body.firstChild) body.innerHTML = drugBody(DRUG[id]);
  }
  var em = d.getAttribute('data-em');
  if (d.tagName === 'DETAILS' && em) S.emOpen[em] = d.open;
}, true);

/* ===== 03 drugs tab ===== */
function drugMatches(d) {
  if (S.group !== 'all' && d.group !== S.group) return false;
  var q = S.q.trim().toLowerCase();
  if (!q) return true;
  var hay = (d.name + ' ' + d.id + ' ' + d['class'] + ' ' + d.entries.map(function (e) { return e.use; }).join(' ')).toLowerCase();
  return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
}
function fitCount(d) {
  return d.entries.filter(function (e) { return E.entryMatchesAge(e, P.ageY); }).length;
}
function drugBody(d) {
  return '<div class="d-tools">' + concSelect(d) + '</div>' +
    entriesByUse(d.entries, concOf(d)) + cautionsHtml(d.cautions);
}
function drugCard(d) {
  var open = !!S.open[d.id];
  var n = d.entries.length;
  var cnt = P.ageY === null ? n + ' lines' : fitCount(d) + ' of ' + n + ' fit age';
  return '<details class="drug" data-drug="' + d.id + '"' + (open ? ' open' : '') + '>' +
    '<summary><span class="d-name">' + esc(d.name) + '</span><span class="d-class">' + esc(d['class']) + '</span>' +
    '<span class="d-count">' + cnt + '</span></summary>' +
    '<div class="d-body">' + (open ? drugBody(d) : '') + '</div></details>';
}
function drugListHtml() {
  var list = DATA.drugs.filter(drugMatches);
  if (!list.length) return '<div class="banner info">No drug matches this search.</div>';
  return '<p class="small muted" style="margin-bottom:8px">' + list.length + ' of ' + DATA.drugs.length + ' drugs. Tap a drug to open it.</p>' +
    list.map(drugCard).join('');
}
OUT.drugList = function () { $('#drug-list').innerHTML = drugListHtml(); };

function viewDrugs() {
  var h = '<div class="toolbar">';
  h += '<div class="fld"><label class="lbl" for="q">Search drugs, classes or uses</label>' +
    '<input id="q" type="search" data-k="q" data-out="drugList" value="' + esc(S.q) + '" placeholder="for example rocuronium, induction, reversal" autocomplete="off"></div>';
  h += '<div class="chips" id="gchips">' + GROUPS.map(function (g) {
    return '<button type="button" class="gchip" data-act="group" data-g="' + g[0] + '" aria-pressed="' + (S.group === g[0]) + '">' + esc(g[1]) + '</button>';
  }).join('') + '</div>';

    '> Hide lines outside the patient’s age (otherwise they are dimmed)</label>';

ACT.group = function (el) {

};
CHG.conc = function (el) {
  var id = el.getAttribute('data-drug');

/* ===== 04 infusions and TIVA tabs ===== */
var ENTRY = {};
DATA.drugs.forEach(function (d) { d.entries.forEach(function (e) { ENTRY[e.id] = { e: e, d: d }; }); });
function isRateEntry(e) {
  if (e.kind !== 'infusion' && e.kind !== 'fixed-rate') return false;
  var pu = E.parseUnit(e.unit);
  return !!(pu && pu.time && e.lo !== null && e.lo !== undefined);
}
var INF_DRUGS = DATA.drugs.filter(function (d) { return d.entries.some(isRateEntry); });
var RATE_UNITS = ['mcg/kg/min', 'mcg/kg/h', 'mg/kg/h', 'mg/kg/min', 'mcg/min', 'mg/min', 'mg/h', 'mcg/h'];

function fieldNum(x) { return (x === null || x === undefined || !isFinite(x)) ? '' : String(+x.toPrecision(4)); }
function resultBox(label, big, cls) {
  return '<div class="result ' + (cls || '') + '"><div class="lab">' + esc(label) + '</div><div class="big">' + big + '</div></div>';
}

/* ---------- Infusions: dose <-> pump rate ---------- */
function convConc() {
  var c = S.conv;
  if (c.drug === 'custom') {
    var v = pos(c.custom);
    return v ? { v: v, u: c.customU, label: fmt(v) + ' ' + c.customU } : null;
  }
  var d = DRUG[c.drug];
  return d ? d.conc[Math.min(c.cidx, d.conc.length - 1)] : null;
}
function syncConv() {
  var c = S.conv, conc = convConc();
  var pu = E.parseUnit(c.unit);
  var ok = conc && pu && (!pu.perKg || P.wt);
  if (!ok) {
    if (c.last === 'dose') c.rate = ''; else c.dose = '';
    return;
  }
  if (c.last === 'dose') {
    var d = num(c.dose);
    c.rate = d === null ? '' : fieldNum(E.doseToRate(d, c.unit, P.wt, conc));
  } else {
    var r = num(c.rate);
    c.dose = r === null ? '' : fieldNum(E.rateToDose(r, c.unit, P.wt, conc));
  }
}
function convOutHtml() {
  var c = S.conv, conc = convConc(), pu = E.parseUnit(c.unit);
  if (!conc) return '<div class="banner info">Choose a concentration, or enter your own.</div>';
  if (pu && pu.perKg && !P.wt) return '<div class="banner warn"><span class="need">Enter the patient weight for per-kg doses.</span></div>';
  var dose = num(c.dose), rate = num(c.rate);
  if (dose === null && rate === null) return '<p class="muted small">Type a dose or a pump rate: the other one is calculated.</p>';
  var mgml = E.concMgPerMl(conc);
  var h = '<div class="pair">';
  if (rate !== null) h += resultBox('Pump rate', fmt(rate) + ' mL/h');
  if (dose !== null) h += resultBox('Dose', fmt(dose) + ' ' + esc(c.unit));
  if (rate !== null) h += resultBox('Drug delivered', fmt(rate * mgml) + ' mg/h' + (mgml < 1 ? '<div class="small muted num">' + fmt(rate * mgml * 1000) + ' mcg/h</div>' : ''));
  h += resultBox('Concentration', fmt(mgml) + ' mg/mL' + '<div class="small muted num">' + fmt(mgml * 1000) + ' mcg/mL</div>');
  h += '</div>';
  var syr = pos(c.syr), mins = pos(c.mins);
  if (rate !== null && rate > 0) {
    h += '<div class="pair sp">';
    if (syr) h += resultBox('A ' + fmt(syr) + ' mL syringe lasts', E.fmtDuration(E.syringeMinutes(syr, rate)));
    if (mins) h += resultBox('Volume for ' + fmt(mins) + ' min', fmt(E.volumeNeeded(rate, mins)) + ' mL');
    h += '</div>';
  }
  return h;
}
OUT.conv = function (el) {
  var c = S.conv;
  if (el && el.id === 'cv-dose') c.last = 'dose';
  else if (el && el.id === 'cv-rate') c.last = 'rate';
  syncConv();
  var rEl = $('#cv-rate'), dEl = $('#cv-dose');
  if (el && el.id !== 'cv-rate' && rEl && c.last === 'dose') rEl.value = c.rate;
  if (el && el.id !== 'cv-dose' && dEl && c.last === 'rate') dEl.value = c.dose;
  var out = $('#conv-out');
  if (out) out.innerHTML = convOutHtml();
};
CHG.convDrug = function (el) {
  var c = S.conv;
  c.drug = el.value; c.cidx = 0; c.dose = ''; c.rate = ''; c.last = 'dose';
  if (c.drug !== 'custom') {

};
CHG.convConc = function (el) { S.conv.cidx = +el.value; syncConv(); renderView(); };
CHG.convUnit = function () { syncConv(); renderView(); };
ACT.useDose = function (el) {

};

/* concentration builder, ratio and percent */
function mixOutHtml() {

OUT.ratio = function () { $('#rp-out').innerHTML = ratioOutHtml(); };
function ratioTable() {

// numeric limit in mg for one 'max' entry (null when it cannot be expressed in mg)
function limitMg(e) {
  var pu = E.parseUnit(e.unit);
  if (e.unit === 'mg/24 h') return { lo: e.lo, hi: e.hi, per24: true };
  if (!pu || pu.time || pu.mass !== 'mg') return null;
  if (!pu.perKg) return { lo: e.lo, hi: e.hi };
  var c = E.calcEntry(e, P.wt, null);
  if (c.type !== 'amount') return null;
  return { lo: c.amountLo, hi: c.amountHi, capped: c.capped, capAmount: c.capAmount, uncappedHi: c.uncappedHi };
}
function localOutHtml() {
