        '<div class="e-src e-wide">' + statusChip('literature') + srcChip(r.src) + '</div></div>';
    });
    if (!shown) h += '<p class="small muted">No depth rule applies at this age and weight.</p>';
    h += '<p class="small muted sp">Confirm the final position with auscultation, capnography and imaging as indicated.</p>';
  }
  return h;
}

function bloodOutHtml() {
  var a = P.ageY, wt = P.wt;
  if (a === null || !wt) return '<div class="banner warn"><span class="need">Enter age and weight.</span></div>';
  var id = E.ebvBandFor(a, P.prem);
  var band = DATA.ebv.bands.filter(function (b) { return b.id === id; })[0];
  var r = E.ebv(band, wt, S.blood.pick);
  var h = '<div class="pair">' +
    resultBox('Estimated blood volume', fmt(r.mL) + ' mL<div class="small muted num">' + fmt(r.perKg) + ' mL/kg; range ' + fmt(r.loMl) + '–' + fmt(r.hiMl) + ' mL</div>') +
    resultBox('Band used', esc(band.label) + '<div class="small muted num">' + fmt(band.lo) + '–' + fmt(band.hi) + ' mL/kg</div>') + '</div>';
  h += '<p class="small sp">' + esc(band.note) + '</p>';
  if (P.band === 'adolescent') h += '<p class="small muted">Adolescents use the child band here: the sources give no separate adolescent value.</p>';
  h += '<div class="e-src sp">' + statusChip('literature') + srcChips(band) + '</div>';

  var hi = pos(S.blood.hi), ha = pos(S.blood.ha);
  h += '<h4 class="use-h">Allowable blood loss</h4>';
  if (!hi || !ha) {
    h += '<p class="small muted">Enter the starting and the lowest acceptable hematocrit (%).</p>';
  } else {
    var warn = (hi > 70 || ha > 70 || hi < 5 || ha < 5) ? '<div class="alert" role="alert">Hematocrit values look unusual: enter percent (for example 40).</div>' : '';
    var f = DATA.ebv.formulas;
    var main = E.abl(r.mL, hi, ha, 'initial');
    h += warn;
    if (main.ml === 0) {
      h += '<div class="banner info">' + esc(main.note) + '</div>';
    } else {
      h += '<div class="pair">' + resultBox('Allowable blood loss', fmt(main.ml) + ' mL<div class="small muted num">' + fmt(main.pct) + '% of the estimated blood volume</div>') + '</div>';
    }
    h += '<p class="small sp">' + esc(f[0].text) + '. ' + esc(f[0].note) + '</p><div class="e-src">' + statusChip(f[0].status) + srcChips(f[0]) + '</div>';
    var alt = E.abl(r.mL, hi, ha, 'mean');
    if (alt && alt.ml > 0) {
      h += '<div class="entry sp"><div class="e-head e-wide"><span class="e-pop">' + esc(f[1].label) + '</span> ' + statusChip(f[1].status) + '</div>' +
        '<div class="e-dose"><span>' + fmt(alt.ml) + ' mL</span></div><p class="e-note e-wide muted">' + esc(f[1].text) + '</p>' + verifyBox(f[1].verifyNote) + '</div>';
    }
  }
  return h;
}
OUT.blood = function () { $('#blood-out').innerHTML = bloodOutHtml(); };

function viewAirway() {
  var h = '<div class="view-h"><h2>Endotracheal tube size</h2></div>';
  h += '<section class="card">' + ettHtml() + '</section>';
  h += '<div class="view-h sp"><h2>Blood volume and allowable blood loss</h2></div>';
  h += '<section class="card stack"><div class="row">' +
    '<div class="fld grow"><label class="lbl" for="bl-pick">Blood volume estimate</label><select id="bl-pick" data-k="blood.pick" data-out="blood">' +
    [['lo', 'Low end of the range'], ['mid', 'Middle of the range'], ['hi', 'High end of the range']].map(function (o) {
      return '<option value="' + o[0] + '"' + (S.blood.pick === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select></div>' +
    '<div class="fld grow"><label class="lbl" for="bl-hi">Starting Hct (%)</label><input id="bl-hi" type="number" inputmode="decimal" min="0" step="any" data-k="blood.hi" data-out="blood" value="' + esc(S.blood.hi) + '"></div>' +
    '<div class="fld grow"><label class="lbl" for="bl-ha">Lowest acceptable Hct (%)</label><input id="bl-ha" type="number" inputmode="decimal" min="0" step="any" data-k="blood.ha" data-out="blood" value="' + esc(S.blood.ha) + '"></div></div>' +
    '<div id="blood-out">' + bloodOutHtml() + '</div></section>';
  return h;
}

/* ===== 06 emergency tab and sources tab ===== */
function emItemHtml(it) {
  var wt = P.wt;
  var dep = it.perKg !== undefined || it.perKgLt !== undefined || it.wtMin !== undefined || it.wtMax !== undefined;
  var r = (wt || !dep) ? E.emergencyItem(it, wt || 0) : { type: 'needWeight' };
  if (r.hidden) return '';
  var h = '<div class="entry"><div class="e-head e-wide"><span class="e-pop">' + esc(it.label) + '</span>' +
    (it.when ? '<span class="e-route">' + esc(it.when) + '</span>' : '') + '</div>';
  if (r.type === 'text') {
    h += '<p class="e-note e-wide">' + esc(it.text) + '</p>';
  } else if (r.type === 'needWeight') {
    h += '<div class="e-wide"><span class="need">Enter weight</span></div>' + (it.note ? '<p class="e-note e-wide muted">' + esc(it.note) + '</p>' : '');
  } else {
    var val = (r.lessThan ? 'under ' : '') + rng(r.lo, r.hi) + ' ' + r.unit;
    if (r.upTo !== undefined) val += ' (up to ' + fmt(r.upTo) + ' ' + r.unit + ')';
    var calc = '<b>' + esc(val) + '</b>';
    if (r.ml !== undefined) calc += ' = <b>' + rng(r.ml, r.mlHi) + ' mL</b> of ' + fmt(it.conc) + ' ' + esc(it.concUnit);
    if (r.mlPerH !== undefined) calc += ' ≈ <b>' + fmt(r.mlPerH) + ' mL/h</b>';
    if (r.vials !== undefined) calc += ' = <b>' + r.vials + ' vial' + (r.vials === 1 ? '' : 's') + '</b> of ' + fmt(it.vialMg) + ' mg';
    h += '<div class="e-calc e-wide">' + calc + '</div>';
    if (r.capped) h += '<div class="e-wide"><span class="badge cap">maximum applied</span></div>';
    if (it.note) h += '<p class="e-note e-wide">' + esc(it.note) + '</p>';
  }
  if (it.verifyNote) h += '<div class="e-wide">' + verifyBox(it.verifyNote) + '</div>';
  return h + '</div>';
}
function viewEmergency() {
  var h = '<div class="banner warn"><span aria-hidden="true">⚠</span><div><b>Reference only.</b> In an emergency follow your institution’s protocol and call for help first. ' +
    'Weight used: <b class="num">' + (P.wt ? fmt(P.wt) + ' kg' : 'not entered') + '</b>. Check every dose against the drug and concentration in your hand.</div></div>';
  DATA.emergency.protocols.forEach(function (p) {
    var open = !!S.emOpen[p.id];
    h += '<details class="drug card em" data-em="' + p.id + '"' + (open ? ' open' : '') + ' style="padding:0">' +
      '<summary><span class="d-name">' + esc(p.title) + '</span><span class="d-class">' + esc(p.pop) + '</span></summary><div class="d-body">' +
      '<div class="e-src" style="margin-bottom:6px">' + statusChip(p.status) + srcChips(p) + '</div>' +
      '<p class="e-note">' + esc(p.intro) + '</p>' +
      p.items.map(emItemHtml).join('') + '</div></details>';
  });
  return h;
}

/* ---------- Sources ---------- */
function countSourceUse() {
  var n = {};
  function add(id) { n[id] = (n[id] || 0) + 1; }
  function walk(o) {
    if (Array.isArray(o)) { o.forEach(walk); return; }
    if (o && typeof o === 'object') {
      Object.keys(o).forEach(function (k) {
        if (k === 'src' && typeof o[k] === 'string') add(o[k]);
        else if (k === 'alsoSrc' && Array.isArray(o[k])) o[k].forEach(add);
        else if (k !== 'sources') walk(o[k]);
      });
    }
  }
  walk(DATA.drugs); walk(DATA.emergency); walk(DATA.tiva); walk(DATA.ett); walk(DATA.ebv);
  return n;
}
function viewSources() {
  var all = [];
  DATA.drugs.forEach(function (d) { d.entries.forEach(function (e) { all.push(e); }); });
  var cnt = { label: 0, guideline: 0, literature: 0, pending: 0, 'book-verified': 0 };
  all.forEach(function (e) {
    if (e.bookRef || e.status === 'book-verified' || e.status === 'book-reserved') cnt['book-verified']++;
    else cnt[e.status] = (cnt[e.status] || 0) + 1;
  });
  var flagged = all.filter(function (e) { return e.verifyNote; }).length;
  var M = DATA.meta;
  var h = '<div class="view-h"><h2>How far to trust each number</h2><span class="small muted">' + all.length + ' dose lines in ' + DATA.drugs.length + ' drugs</span></div>';
  h += '<section class="card stack"><div class="legend">';
  ['label', 'guideline', 'literature', 'pending', 'book-verified'].forEach(function (s) {
    h += '<div>' + statusChip(s) + '<span><b class="num">' + (cnt[s] || 0) + '</b> lines. ' + esc(statusHelp(s)) + '</span></div>';
  });
  h += '</div><p class="small">' + flagged + ' lines carry a “Check” note describing what is still open. ' +
    '<b>No line is book-verified yet:</b> the Miller and Barash chapters have not been cross-checked against this data. When a line is confirmed against a chapter it gets a book reference and the Book-verified status.</p></section>';

  h += '<div class="view-h sp"><h2>Verification log</h2><span class="small muted">data checked ' + esc(M.dataChecked) + '</span></div><section class="card">';
  DATA.verification.forEach(function (v) {
    var cls = v.status === 'confirmed' ? 'st-book' : 'st-pending';
    h += '<div class="entry"><div class="e-head e-wide"><span class="e-pop">' + esc(v.item) + '</span><span class="chip ' + cls + '">' + esc(v.status) + '</span><span class="e-route num">' + esc(v.date) + '</span></div>' +
      '<p class="e-note e-wide">' + esc(v.result) + '</p></div>';
  });
  h += '</section>';

  h += '<div class="view-h sp"><h2>Known gaps</h2></div><section class="card"><ul class="cautions" style="margin:0">' +
    DATA.gaps.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') + '</ul></section>';

  h += '<div class="view-h sp"><h2>Limits of this tool</h2></div><section class="card"><ul class="cautions" style="margin:0">' +
    '<li>It is a reference and calculator for qualified clinicians. It is not a medical device and does not replace the drug label, local protocols or clinical judgment.</li>' +
    '<li>Every dose line shows its source and status. Lines marked Check have an open question: read the note before using the number.</li>' +
    '<li>Numbers are shown to about three significant digits. Confirm the drug, concentration, weight and units on the syringe and on the pump.</li>' +
    '<li>Labels and guidelines change. Data were checked on ' + esc(M.dataChecked) + ' (version ' + esc(M.version) + ').</li>' +
    '<li>Nothing you type is saved or sent anywhere: reloading the page clears the patient and every field.</li>' +
    '<li>TCI models are not simulated. The pump runs the pharmacokinetic model; this page only lists targets and the limits quoted in the sources.</li>' +
    '</ul></section>';

  h += '<div class="view-h sp"><h2>Growing the foundation</h2></div><section class="card stack">' +
    '<p class="small">The data live in JSON files, separate from the calculation engine. A new drug is one object: id, name, group, class, concentrations and dose lines. ' +
    'Each dose line carries age limits, route, kind (bolus, infusion, loading, fixed, maximum), low and high values, a unit, a note, a source id and a status. ' +
    'Lines also have an empty book reference slot, so a chapter citation (book, edition, chapter, page) can be added without changing anything else.</p>' +
    '<p class="small muted">Next planned step: attach Miller and Barash chapters, compare each line, and upgrade confirmed lines to Book-verified.</p></section>';

  var use = countSourceUse();
  h += '<div class="view-h sp"><h2>Bibliography</h2><span class="small muted">' + SRC_KEYS.length + ' sources</span></div><section class="card"><ol class="biblio">';
  SRC_KEYS.forEach(function (k) {
    var s = DATA.sources[k];
    h += '<li id="src-' + esc(k) + '"><span class="no">[' + SRC_NUM[k] + ']</span><span><a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.title) + '</a>' +
      '<br><span class="small muted">' + esc(s.type) + ' · retrieved ' + esc(s.retrieved) + ' · used by ' + (use[k] || 0) + ' items</span></span></li>';
  });
  h += '</ol></section>';
  return h;
}

/* ===== 07 main: view switching and start-up ===== */
var VIEWS = {
  drugs: viewDrugs, infusions: viewInfusions, tiva: viewTiva, local: viewLocal,
  airway: viewAirway, emergency: viewEmergency, sources: viewSources
};
function renderView() {
  var v = $('#view');
  v.innerHTML = VIEWS[S.tab]();
  v.setAttribute('aria-labelledby', 'tab-' + S.tab);
}
function renderFoot() {
  $('#foot').innerHTML =
    '<p><b>Reference tool for qualified clinicians.</b> It does not replace the drug label, your institution’s protocols or clinical judgment. ' +
    'The clinician giving the drug is responsible for the dose. Check any dose you are unsure of against the current label and with a pharmacist or senior colleague.</p>' +
    '<p>No patient data are stored or sent: everything is calculated on this page and cleared when it reloads. ' +
    'Doses cite regulatory labels, guidelines and published papers; none is book-verified yet (see Sources).</p>';
}
(function init() {
  deriveSet();
  var M = DATA.meta;
  $('#meta-line').textContent = 'Version ' + M.version + ' · data checked ' + M.dataChecked + ' · pediatric to adult reference';
  renderPatient();
  renderBanner();
  renderSummary();
  renderTabs();
  renderView();
  renderFoot();
})();

})();</script>
